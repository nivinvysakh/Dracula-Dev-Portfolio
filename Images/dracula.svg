<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="capeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd93f9" />
      <stop offset="100%" stop-color="#6272a4" />
    </linearGradient>
    <linearGradient id="innerCape" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5555" />
      <stop offset="100%" stop-color="#ff79c6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="80" r="68" fill="#bd93f9" opacity="0.15" filter="url(#glow)"/>

  <!-- Bat Wings / High Collar Cape (Back) -->
  <path d="M 24 95 Q 16 40 48 48 Q 60 70 80 75 Q 100 70 112 48 Q 144 40 136 95 Q 120 135 80 145 Q 40 135 24 95 Z" fill="#282a36" stroke="#44475a" stroke-width="3"/>
  <path d="M 32 92 Q 26 55 50 60 Q 64 78 80 82 Q 96 78 110 60 Q 134 55 128 92 Q 112 125 80 132 Q 48 125 32 92 Z" fill="url(#innerCape)"/>

  <!-- High Dracula Winged Collar -->
  <path d="M 40 48 L 56 90 L 80 100 L 104 90 L 120 48 Q 98 72 80 74 Q 62 72 40 48 Z" fill="url(#capeGrad)" stroke="#bd93f9" stroke-width="2"/>

  <!-- Cute Chibi Head -->
  <circle cx="80" cy="74" r="34" fill="#f8f8f2" stroke="#282a36" stroke-width="3"/>

  <!-- Dracula Widow's Peak Hair -->
  <path d="M 47 70 Q 48 42 80 42 Q 112 42 113 70 C 108 56 94 54 80 64 C 66 54 52 56 47 70 Z" fill="#282a36"/>
  <!-- Hair highlights -->
  <path d="M 58 48 Q 80 44 94 48" stroke="#6272a4" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cute Big Eyes -->
  <circle cx="68" cy="74" r="5.5" fill="#282a36"/>
  <circle cx="92" cy="74" r="5.5" fill="#282a36"/>
  <!-- Eye Sparkles -->
  <circle cx="66" cy="72" r="2" fill="#50fa7b"/>
  <circle cx="90" cy="72" r="2" fill="#50fa7b"/>
  <circle cx="70" cy="76" r="0.8" fill="#ffffff"/>
  <circle cx="94" cy="76" r="0.8" fill="#ffffff"/>

  <!-- Cute Pink Blush -->
  <ellipse cx="61" cy="81" rx="4" ry="2.5" fill="#ff79c6" opacity="0.6"/>
  <ellipse cx="99" cy="81" rx="4" ry="2.5" fill="#ff79c6" opacity="0.6"/>

  <!-- Smile with Vampire Fangs -->
  <path d="M 72 82 Q 80 88 88 82" stroke="#282a36" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Fangs -->
  <polygon points="73,82 76,87 77,82" fill="#ffffff" stroke="#282a36" stroke-width="0.8"/>
  <polygon points="87,82 84,87 83,82" fill="#ffffff" stroke="#282a36" stroke-width="0.8"/>

  <!-- Cute Dracula Bowtie / Medallion -->
  <path d="M 72 108 L 80 114 L 88 108 L 88 118 L 80 114 L 72 118 Z" fill="#ff79c6" stroke="#282a36" stroke-width="1.5"/>
  <circle cx="80" cy="113" r="3" fill="#50fa7b" stroke="#282a36" stroke-width="1"/>

  <!-- Floating Bat Sparks/Stars -->
  <path d="M 28 34 Q 33 30 38 34 Q 33 38 28 34" fill="#bd93f9"/>
  <path d="M 124 28 Q 129 24 134 28 Q 129 32 124 28" fill="#ff79c6"/>
  <circle cx="138" cy="42" r="1.5" fill="#50fa7b"/>
  <circle cx="22" cy="48" r="1.5" fill="#50fa7b"/>
</svg>
